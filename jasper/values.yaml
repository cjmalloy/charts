# Default values for jasper.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/cjmalloy/jasper
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

config:
  profiles: prod
  minRole: ROLE_ANONYMOUS
  defaultRole: ROLE_ANONYMOUS
  allowUserTagHeader: false
  allowUserRoleHeader: false
  allowAuthHeaders: false
  sshConfigNamespace: "default"
  sshConfigMapName: "ssh-authorized-keys"
  maxRequests: ""
  maxConcurrentRequests: ""
  maxRequestsOrigin: ""
  heap: 512m
  gc: g1gc
  livenessTimeout: 5
  csp: "default-src 'self'; frame-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
  override:
    security:
      mode: ''
      clientId: ''
      clientSecret: ''
      jwksUri: ''
      usernameClaim: ''
      tokenEndpoint: ''
      scimEndpoint: ''
  mail:
    host: smtp-relay.gmail.com
    port: 587
    localhost: jasper.local
  redis: ''

smtp:
  enabled: false
  repository: ghcr.io/cjmalloy/smtp-hook
  pullPolicy: IfNotPresent
  tag: v1.0.2
  origin: ""
  headers: ""

## Built in PostgreSQL database using the official postgres image from Docker Hub.
## Set postgresql.enabled=false and configure externalDatabase to use an existing database.
postgresql:
  enabled: true
  # Name of the StatefulSet, Service and Secret. Defaults to "<fullname>-db".
  # Kept as jasper-db for compatibility with the previously bundled Bitnami chart.
  fullnameOverride: jasper-db
  image:
    # Use postgis/postgis (with a tag such as "18-3.6") for PostGIS support
    repository: postgres
    tag: "18.6"
    pullPolicy: IfNotPresent
  auth:
    database: jasper
    # Password for the "postgres" superuser. A random password is generated if empty.
    # Only used when the database is first initialized.
    postgresPassword: ""
    # Use an existing secret for the "postgres" superuser password
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
  # Extra arguments for initdb when the database is first created
  initdbArgs: ""
  ## Major version upgrades.
  ## When the existing data directory was created by an older major version of PostgreSQL
  ## (for example the PostgreSQL 17 data created by the previous Bitnami chart),
  ## it is dumped using this image and restored into a new data directory using postgresql.image.
  ## The old data directory and dump are kept on the volume under /pgdata/upgrade.
  ## This image must be the same major version as the existing data (and include PostGIS if used).
  upgrade:
    enabled: true
    image:
      repository: postgres
      tag: "17"
      pullPolicy: IfNotPresent
  primary:
    # Appended to postgresql.conf
    extendedConfiguration: |-
      default_text_search_config = 'pg_catalog.english'
    # Replaces pg_hba.conf
    pgHbaConfiguration: |-
      local all all trust
      host all all all scram-sha-256
    persistence:
      enabled: true
      # Use an existing PVC instead of creating one
      existingClaim: ""
      # storageClass: "-"
      storageClass: ""
      accessModes:
        - ReadWriteOnce
      size: 8Gi
      annotations: {}
      labels: {}
      selector: {}
    podAnnotations: {}
    podSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

## Existing database to use when postgresql.enabled=false
externalDatabase:
  host: ""
  port: 5432
  database: jasper
  username: postgres
  # Creates a secret with this password, ignored if existingSecret is set
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  # Overrides host, port and database
  jdbcUrl: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

## Enable persistence using Persistent Volume Claims
## ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
##
persistence:
  enabled: false
  # storageClassName: default
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  # annotations: {}
  finalizers:
    - kubernetes.io/pvc-protection
  # selectorLabels: {}
  # subPath: ""
  # existingClaim:

  ## If persistence is not enabled, this allows to mount the
  ## local storage in-memory to improve performance
  ##
  inMemory:
    enabled: false
    ## The maximum usage on memory medium EmptyDir would be
    ## the minimum value between the SizeLimit specified
    ## here and the sum of memory limits of all containers in a pod
    ##
    # sizeLimit: 300Mi

ingress:
  enabled: false
  tenants:
    - origin: ""
      className: ""
      userTag: ""
      userRole: ""
      readAccess: ""
      writeAccess: ""
      tagReadAccess: ""
      tagWriteAccess: ""
      annotations: {}
      host: chart-example.local
      path: /api
      websockets: true
      websocketPath: /websocket
      publicClassName: ""
      publicApi: true
      publicApiPath: /pub
      publicApiAnnotations: {}
      pathType: ImplementationSpecific
      tlsSecretName: chart-example-tls

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: affinity
              operator: In
              values:
                - worker
        topologyKey: "kubernetes.io/hostname"

sshTunnel:
  enabled: false

  replicaCount: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 20

  image:
    repository: ghcr.io/cjmalloy/jasper-ssh
    pullPolicy: IfNotPresent
    tag: v1.2.5

  localOrigin: ""
  userTag: ""
  userRole: "ROLE_VIEWER"
  readAccess: ""
  writeAccess: ""
  tagReadAccess: ""
  tagWriteAccess: ""
  authorizedKeys: ""
  authorizedKeysConfigMap: ""
  hostKey: ""
  hostKeySecret: ""
  configChangeMode: drain

  terminationGracePeriodSeconds: 604800

  imagePullSecrets: [ ]

  podAnnotations: { }

  podSecurityContext: { }
  # fsGroup: 2000

  securityContext: { }
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

  service:
    type: ClusterIP
    port: 22

  resources: { }
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
  #   cpu: 100m
  #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: { }

  tolerations: [ ]

  affinity: { }

  controller:
    enabled: true

    image:
      repository: ghcr.io/cjmalloy/jasper-ssh-controller
      pullPolicy: IfNotPresent
      tag: v1.2.5

    rolloutDelay: 0s

    imagePullSecrets: [ ]

    podAnnotations: { }

    podSecurityContext: { }

    securityContext: { }

    resources: { }

    nodeSelector: { }

    tolerations: [ ]

    affinity: { }


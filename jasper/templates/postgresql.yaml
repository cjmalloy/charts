{{- if .Values.postgresql.enabled }}
{{- $fullname := include "jasper.postgresql.fullname" . }}
{{- $pg := .Values.postgresql }}
{{- if not $pg.auth.existingSecret }}
{{- $password := $pg.auth.postgresPassword }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- if and $existing $existing.data (index $existing.data "postgres-password") }}
{{- $password = index $existing.data "postgres-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
  annotations:
    # The password is only applied when the database is initialized, so keep it
    # if the release is deleted while the data volume remains.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $password | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-hl
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    {{- include "jasper.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    {{- include "jasper.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fullname }}-hl
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "jasper.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jasper.postgresql.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/postgresql-config.yaml") . | sha256sum }}
        {{- with $pg.primary.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $pg.primary.podSecurityContext | nindent 8 }}
      {{- if $pg.upgrade.enabled }}
      initContainers:
        - name: upgrade-dump
          image: "{{ $pg.upgrade.image.repository }}:{{ $pg.upgrade.image.tag }}"
          imagePullPolicy: {{ $pg.upgrade.image.pullPolicy }}
          securityContext:
            {{- toYaml $pg.primary.containerSecurityContext | nindent 12 }}
          command: ["bash", "/etc/postgresql/upgrade-dump.sh"]
          env:
            - name: PGDATA
              value: /pgdata/data
          resources:
            {{- toYaml $pg.primary.resources | nindent 12 }}
          volumeMounts:
            {{- include "jasper.postgresql.volumeMounts" . | nindent 12 }}
        - name: upgrade-restore
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            {{- toYaml $pg.primary.containerSecurityContext | nindent 12 }}
          command: ["bash", "/etc/postgresql/upgrade-restore.sh"]
          env:
            {{- include "jasper.postgresql.env" . | nindent 12 }}
          resources:
            {{- toYaml $pg.primary.resources | nindent 12 }}
          volumeMounts:
            {{- include "jasper.postgresql.volumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            {{- toYaml $pg.primary.containerSecurityContext | nindent 12 }}
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          env:
            {{- include "jasper.postgresql.env" . | nindent 12 }}
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "dbname={{ $pg.auth.database }}", "-h", "127.0.0.1", "-p", "5432"]
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "dbname={{ $pg.auth.database }}", "-h", "127.0.0.1", "-p", "5432"]
          resources:
            {{- toYaml $pg.primary.resources | nindent 12 }}
          volumeMounts:
            {{- include "jasper.postgresql.volumeMounts" . | nindent 12 }}
      {{- with $pg.primary.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.primary.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.primary.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: empty-dir
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
        {{- if not $pg.primary.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if $pg.primary.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $pg.primary.persistence.existingClaim }}
        {{- end }}
  {{- if and $pg.primary.persistence.enabled (not $pg.primary.persistence.existingClaim) }}
  {{- with $pg.primary.persistence }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .size | quote }}
        {{- with .selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .storageClass }}
        {{- if eq "-" .storageClass }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .storageClass | quote }}
        {{- end }}
        {{- end }}
  {{- end }}
  {{- end }}
{{- end }}

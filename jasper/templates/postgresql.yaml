{{- if .Values.postgresql.enabled }}
{{- $fullname := include "jasper.postgresql.fullname" . }}
{{- $pg := .Values.postgresql }}
{{- if not $pg.auth.existingSecret }}
{{- $password := $pg.auth.postgresPassword }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- if and $existing $existing.data (index $existing.data "postgres-password") }}
{{- $password = index $existing.data "postgres-password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
  annotations:
    # The password is only applied when the database is initialized, so keep it
    # if the release is deleted while the data volume remains.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $password | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-hl
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    {{- include "jasper.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: tcp-postgresql
  selector:
    {{- include "jasper.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jasper.postgresql.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fullname }}-hl
  selector:
    matchLabels:
      {{- include "jasper.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $pg.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jasper.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          {{- with $pg.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - postgres
            {{- range $key, $value := $pg.config }}
            - -c
            - {{ printf "%s=%v" $key $value | quote }}
            {{- end }}
          env:
            {{- include "jasper.postgresql.env" . | nindent 12 }}
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          {{- $probe := dict "exec" (dict "command" (list "pg_isready" "-U" "postgres" "-d" (printf "dbname=%s" $pg.auth.database) "-h" "127.0.0.1" "-p" "5432")) }}
          {{- with $pg.startupProbe }}
          startupProbe:
            {{- merge (deepCopy .) $probe | toYaml | nindent 12 }}
          {{- end }}
          {{- with $pg.livenessProbe }}
          livenessProbe:
            {{- merge (deepCopy .) $probe | toYaml | nindent 12 }}
          {{- end }}
          {{- with $pg.readinessProbe }}
          readinessProbe:
            {{- merge (deepCopy .) $probe | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: dshm
              mountPath: /dev/shm
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if $pg.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $pg.persistence.existingClaim }}
        {{- end }}
  {{- if and $pg.persistence.enabled (not $pg.persistence.existingClaim) }}
  {{- with $pg.persistence }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        {{- with .annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .size | quote }}
        {{- with .selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .storageClass }}
        {{- if eq "-" .storageClass }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .storageClass | quote }}
        {{- end }}
        {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
